apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secrets
  namespace: default
type: Opaque
stringData:
  rabbitmq-user: $RABBITMQ_DEFAULT_USER
  rabbitmq-pass: $RABBITMQ_DEFAULT_PASS
  rabbitmq-vhost: $RABBITMQ_DEFAULT_VHOST
  rabbitmq-queue: $RABBITMQ_QUEUE
  inventory-host: $INVENTORY_APP_HOST
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-deployment
  namespace: default
  labels:
    app: api-gateway-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway-app
  template:
    metadata:
      labels:
        app: api-gateway-app
    spec:
      containers:
      - name: api-gateway-app
        image: $DOCKER_USER/api-gateway-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080 
          name: http
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: RABBITMQ_HOST
          value: "rabbitmq-service"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              name: api-gateway-secrets
              key: rabbitmq-user
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: api-gateway-secrets
              key: rabbitmq-pass
        - name: RABBITMQ_DEFAULT_VHOST
          valueFrom:
            secretKeyRef:
              name: api-gateway-secrets
              key: rabbitmq-vhost
        - name: RABBITMQ_QUEUE
          valueFrom:
            secretKeyRef:
              name: api-gateway-secrets
              key: rabbitmq-queue
        - name: INVENTORY_APP_HOST
          valueFrom:
            secretKeyRef:
              name: api-gateway-secrets
              key: inventory-host
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: default
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000 
  selector:
    app: api-gateway-app