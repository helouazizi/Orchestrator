apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secrets
  namespace: default
type: Opaque
stringData:
  # RabbitMQ credentials extracted from your .env
  rabbitmq-user: $RABBITMQ_DEFAULT_USER
  rabbitmq-pass: $RABBITMQ_DEFAULT_PASS
  rabbitmq-vhost: $RABBITMQ_DEFAULT_VHOST
  rabbitmq-queue: $RABBITMQ_QUEUE
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-deployment
  namespace: default
  labels:
    app: api-gateway-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway-app
  template:
    metadata:
      labels:
        app: api-gateway-app
    spec:
      containers:
      - name: api-gateway-app
        image: $DOCKER_USER/api-gateway-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080 # Adjust if your API Gateway code listens internally on a different port (e.g., 3000, 5000)
          name: http
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        # 1. RabbitMQ Connection Target
        - name: RABBITMQ_HOST
          value: "rabbitmq-service"
        - name: RABBITMQ_PORT
          value: "5672"
          
        # 2. Injected Secure Parameters for the Broker Connection
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              name: api-gateway-secrets
              key: rabbitmq-user
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: api-gateway-secrets
              key: rabbitmq-pass
        - name: RABBITMQ_DEFAULT_VHOST
          valueFrom:
            secretKeyRef:
              name: api-gateway-secrets
              key: rabbitmq-vhost
        - name: RABBITMQ_QUEUE
          valueFrom:
            secretKeyRef:
              name: api-gateway-secrets
              key: rabbitmq-queue
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: default
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000 # Exposed externally on port 30000 for client traffic
  selector:
    app: api-gateway-app