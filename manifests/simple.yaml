apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-web-app
  labels:
    app: web
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx-html
          image: nginxdemos/hello:plain-text # A lightweight, fun Nginx image that shows pod info
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  type: NodePort # This exposes the service on a specific port on the VM's network interface
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32000 # We lock it to port 32000 so we know exactly where to visit
