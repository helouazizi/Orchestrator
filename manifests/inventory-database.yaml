apiVersion: v1
kind: Secret
metadata:
  name: inventory-database-secrets
  namespace: default
type: Opaque
stringData:
  postgres-user: "$POSTGRES_USER_INVENTORY"
  postgres-password: "$POSTGRES_PASSWORD_INVENTORY"
  postgres-db: "$POSTGRES_DB_INVENTORY"
  inventory-db-port: "$INVENTORY_DB_PORT"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: inventory-database-deployment
  namespace: default
  labels:
    app: inventory-database
spec:
  serviceName: "$INVENTORY_DB_HOST"
  replicas: 1
  selector:
    matchLabels:
      app: inventory-database
  template:
    metadata:
      labels:
        app: inventory-database
    spec:
      containers:
      - name: inventory-database-postgres
        image: "$DOCKER_USER/inventory-database:latest"
        imagePullPolicy: Always
        ports:
        - containerPort: $INVENTORY_DB_PORT
          name: postgresdb
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: inventory-database-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: inventory-database-secrets
              key: postgres-password
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: inventory-database-secrets
              key: postgres-db
        volumeMounts:
        - name: inventory-database-storage
          mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
  - metadata:
      name: inventory-database-storage
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: $INVENTORY_DB_HOST
  namespace: default
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: $INVENTORY_DB_PORT
      targetPort: $INVENTORY_DB_PORT
  selector:
    app: inventory-database