apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-system-secrets
  namespace: default
type: Opaque
stringData:
  rabbitmq-user: $RABBITMQ_DEFAULT_USER
  rabbitmq-pass: $RABBITMQ_DEFAULT_PASS
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path # Uses K3s built-in local path storage engine
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-deployment
  namespace: default
  labels:
    app: rabbitmq
spec:
  replicas: 1
  strategy:
    type: Recreate # Prevents two pods from writing to the same disk volume during a rolling update
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:4.0-management-alpine # Lightweight Alpine image bundled with the web management UI
        ports:
        - containerPort: 5672
          name: amqp
        - containerPort: 15672
          name: management
        env:
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              name: rabbitmq-system-secrets
              key: rabbitmq-user
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: rabbitmq-system-secrets
              key: rabbitmq-pass
        - name: RABBITMQ_DEFAULT_VHOST
          value: "/"
        volumeMounts:
        - name: rabbitmq-storage
          mountPath: /var/lib/rabbitmq
      volumes:
      - name: rabbitmq-storage
        persistentVolumeClaim:
          claimName: rabbitmq-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service # This name matches exactly what your billing and gateway apps look for!
  namespace: default
spec:
  type: NodePort
  ports:
    - port: 5672
      targetPort: 5672
      nodePort: 30672
      name: amqp
    - port: 15672
      targetPort: 15672
      nodePort: 31567
      name: management
  selector:
    app: rabbitmq