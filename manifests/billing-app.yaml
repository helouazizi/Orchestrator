apiVersion: v1
kind: Secret
metadata:
  name: billing-app-secrets
  namespace: default
type: Opaque
stringData:
  postgres-user: "$POSTGRES_USER_BILLING"
  postgres-password: "$POSTGRES_PASSWORD_BILLING"
  postgres-db: "$POSTGRES_DB_BILLING"
  db-url: "$BILLING_DATABASE_URL"
  rabbitmq-user: "$RABBITMQ_DEFAULT_USER"
  rabbitmq-pass: "$RABBITMQ_DEFAULT_PASS"
  rabbitmq-vhost: "$RABBITMQ_DEFAULT_VHOST"
  rabbitmq-host: "$RABBITMQ_HOST"
  rabbitmq-queue: "$RABBITMQ_QUEUE"

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: billing-app-deployment
  namespace: default
  labels:
    app: billing-app
spec:
  # This MUST point to the headless service name below
  serviceName: "billing-app-headless" 
  replicas: 1
  selector:
    matchLabels:
      app: billing-app
  template:
    metadata:
      labels:
        app: billing-app
    spec:
      containers:
      - name: billing-app
        image: "$DOCKER_USER/billing-app:latest"
        imagePullPolicy: Always
        ports:
        - containerPort: $BILLING_PORT 
          name: http
        env:
        # 1. Billing Database Connection Configs
        - name: BILLING_DB_HOST
          value: "$BILLING_DB_HOST" 
        - name: BILLING_DB_PORT
          value: "$BILLING_DB_PORT" 
        - name: POSTGRES_USER_BILLING
          valueFrom:
            secretKeyRef:
              name: billing-app-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD_BILLING
          valueFrom:
            secretKeyRef:
              name: billing-app-secrets
              key: postgres-password
        - name: POSTGRES_DB_BILLING
          valueFrom:
            secretKeyRef:
              name: billing-app-secrets
              key: postgres-db
        - name: BILLING_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: billing-app-secrets
              key: db-url

        # 2. RabbitMQ Connection Configs
        - name: RABBITMQ_HOST
          valueFrom:
            secretKeyRef:
              name: billing-app-secrets
              key: rabbitmq-host
        - name: RABBITMQ_PORT
          value: "$RABBITMQ_PORT" 
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              name: billing-app-secrets
              key: rabbitmq-user
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: billing-app-secrets
              key: rabbitmq-pass
        - name: RABBITMQ_DEFAULT_VHOST
          valueFrom:
            secretKeyRef:
              name: billing-app-secrets
              key: rabbitmq-vhost
        - name: RABBITMQ_QUEUE
          valueFrom:
            secretKeyRef:
              name: billing-app-secrets
              key: rabbitmq-queue

# ---
# # SERVICE 1: Headless Service for StatefulSet Core Identity
# apiVersion: v1
# kind: Service
# metadata:
#   name: billing-app-headless
#   namespace: default
# spec:
#   clusterIP: None
#   ports:
#     - port: $BILLING_PORT
#       targetPort: $BILLING_PORT
#   selector:
#     app: billing-app

---
# SERVICE 2: Standard ClusterIP for your API Gateway routing
apiVersion: v1
kind: Service
metadata:
  name: $BILLING_APP_HOST 
  namespace: default
spec:
  type: ClusterIP 
  ports:
    - port: $BILLING_PORT 
      targetPort: $BILLING_PORT
  selector:
    app: billing-app