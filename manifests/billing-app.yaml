apiVersion: v1
kind: Secret
metadata:
  name: billing-app-secrets
  namespace: default
type: Opaque
stringData:
  # Database keys pulled from .env
  postgres-user: $POSTGRES_USER_BILLING
  postgres-password: $POSTGRES_PASSWORD_BILLING
  postgres-db: $POSTGRES_DB_BILLING
  db-url: $BILLING_DATABASE_URL
  # RabbitMQ keys pulled from .env
  rabbitmq-user: $RABBITMQ_DEFAULT_USER
  rabbitmq-pass: $RABBITMQ_DEFAULT_PASS
  rabbitmq-vhost: $RABBITMQ_DEFAULT_VHOST
  rabbitmq-queue: $RABBITMQ_QUEUE
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-app-deployment
  namespace: default
  labels:
    app: billing-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-app
  template:
    metadata:
      labels:
        app: billing-app
    spec:
      containers:
      - name: billing-app
        image: $DOCKER_USER/billing-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080 # Adjust if your billing app code binds to a different internal port
          name: http
        env:
        # 1. Billing Database Connection Configs
        - name: BILLING_DB_HOST
          value: "billing-database-service"
        - name: BILLING_DB_PORT
          value: "5432"
        - name: POSTGRES_USER_BILLING
          valueFrom:
            secretKeyRef:
              name: billing-app-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD_BILLING
          valueFrom:
            secretKeyRef:
              name: billing-app-secrets
              key: postgres-password
        - name: POSTGRES_DB_BILLING
          valueFrom:
            secretKeyRef:
              name: billing-app-secrets
              key: postgres-db
        - name: BILLING_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: billing-app-secrets
              key: db-url

        # 2. RabbitMQ Connection Configs
        - name: RABBITMQ_HOST
          value: "rabbitmq-service" # Internal core service name for your RabbitMQ cluster broker
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              name: billing-app-secrets
              key: rabbitmq-user
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: billing-app-secrets
              key: rabbitmq-pass
        - name: RABBITMQ_DEFAULT_VHOST
          valueFrom:
            secretKeyRef:
              name: billing-app-secrets
              key: rabbitmq-vhost
        - name: RABBITMQ_QUEUE
          valueFrom:
            secretKeyRef:
              name: billing-app-secrets
              key: rabbitmq-queue
---
apiVersion: v1
kind: Service
metadata:
  name: billing-app-service
  namespace: default
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081 # Exposed uniquely on port 30081
  selector:
    app: billing-app