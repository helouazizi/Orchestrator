apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-app
  labels:
    app: invapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: invapp
  template:
    metadata:
      labels:
        app: invapp
    spec:    
      containers:
        - name: inventory-app
          image: isayen/inventory-app:v1.0
          ports: 
            - containerPort: 8080
          env:
            - name: INVENTORY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: inventory-app-secrets
                  key: url
            - name: INVENTORY_PORT
              valueFrom:
                secretKeyRef:
                  name: inventory-app-secrets
                  key: port
            - name: INVENTORY_HOST
              valueFrom:
                secretKeyRef:
                  name: inventory-app-secrets
                  key: host

---

apiVersion: v1
kind: Service
metadata:
  name: inventory-app-service
spec:
  type: NodePort
  selector: 
    app: invapp
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080

--- 

apiVersion: v1
kind: Secret
metadata:
  name: inventory-app-secrets
type: Opaque
stringData:
  url: "$INVENTORY_DATABASE_URL"
  port: "$INVENTORY_PORT"
  host: "$INVENTORY_HOST"
