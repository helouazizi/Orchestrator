apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-deployment
  labels:
    app: rabbitmq
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
          - name: rabbitmq
            image: isayen/rabbit-queue:v1.0
            ports:
              - containerPort: 5672
              - containerPort: 15672
            env:
              - name: RABBITMQ_DEFAULT_USER
                valueFrom:
                  secretKeyRef:
                    name: rabbitmq-credentials
                    key: username
              - name: RABBITMQ_DEFAULT_PASS
                valueFrom:
                  secretKeyRef:
                    name: rabbitmq-credentials
                    key: password
              - name: RABBITMQ_DEFAULT_VHOST
                valueFrom:
                  secretKeyRef:
                    name: rabbitmq-credentials
                    key: vhost
          
---

apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
spec:
  type: NodePort
  selector:
    app: rabbitmq
  ports:
    - port: 15672
      targetPort: 15672
      nodePort: 30001

---

apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
type: Opaque
stringData:
  username: $RABBITMQ_USER
  password: $RABBITMQ_PASS
  vhost: $RABBITMQ_VHOST  